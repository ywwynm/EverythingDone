<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>粒子消散历史调参蓝本（已停用）</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #202226; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #hud {
    position: fixed; left: 12px; top: 12px; color: #9aa0a6;
    font: 12px/1.6 monospace; user-select: none; pointer-events: none;
  }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="hud">历史模型（第 1–41 轮，已停用）｜当前 canonical 模型请运行 render_curtain_model.py</div>
<script>
// ============ 与 Android ParticleDismissRenderer 保持同步的 GLSL 核心 ============
const VERT = `#version 300 es
precision highp float;
precision highp int;

uniform sampler2D uSnapshot;
uniform vec2 uViewportPx;
uniform vec2 uOriginPx;
uniform float uCellPx;
uniform ivec2 uGrid;
uniform float uTime;
uniform vec2 uWaveOriginUv;
uniform float uSpreadTime;
uniform float uDelayJitter;
uniform float uLifetime;
uniform float uDriftPx;
uniform vec2 uDriftDir;
uniform float uNoiseScalePx;
uniform float uSwirl;
uniform float uFlowEvolve;
uniform float uTurbPx;
uniform float uMaxPointPx;

out highp vec4 vColor;
out highp float vActivation;

float hash21(vec2 p) {
    return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453);
}

float vnoise(vec2 p) {
    vec2 i = floor(p);
    vec2 f = fract(p);
    vec2 u = f * f * (3.0 - 2.0 * f);
    return mix(
        mix(hash21(i), hash21(i + vec2(1.0, 0.0)), u.x),
        mix(hash21(i + vec2(0.0, 1.0)), hash21(i + vec2(1.0, 1.0)), u.x),
        u.y
    );
}

float fbm(vec2 p) {
    return vnoise(p) * 0.667 + vnoise(p * 2.03 + 11.3) * 0.333;
}

// 无散度旋涡场：烟缕的来源。空间连贯——相邻粒子被同一股气流带动
vec2 curlField(vec2 p) {
    float e = 0.12;
    float dy = fbm(p + vec2(0.0, e)) - fbm(p - vec2(0.0, e));
    float dx = fbm(p + vec2(e, 0.0)) - fbm(p - vec2(e, 0.0));
    return vec2(dy, -dx) / (2.0 * e);
}

void main() {
    int ix = gl_VertexID % uGrid.x;
    int iy = gl_VertexID / uGrid.x;
    vec2 cell = vec2(float(ix), float(iy));
    vec2 uv = (cell + 0.5) / vec2(uGrid);
    vec4 color = textureLod(uSnapshot, uv, 0.0);

    uint h = uint(gl_VertexID);
    h = h * 747796405u + 2891336453u;
    h = ((h >> ((h >> 28u) + 4u)) ^ h) * 277803737u;
    h = (h >> 22u) ^ h;
    float h1 = float(h & 1023u) * 0.0009775171;
    float h2 = float((h >> 10u) & 1023u) * 0.0009775171;
    float h3 = float((h >> 20u) & 1023u) * 0.0009775171;

    vec2 snapshotPx = vec2(uGrid) * uCellPx;
    float waveDist = distance(uv * snapshotPx, uWaveOriginUv * snapshotPx)
            / length(snapshotPx);
    float delay = waveDist * uSpreadTime + h1 * uDelayJitter;
    float tl = clamp((uTime - delay) / uLifetime, 0.0, 1.0);

    vec2 basePx = uOriginPx + (cell + 0.5) * uCellPx;

    // 前慢后快：粒子在消失时仍在运动，轻盈不滞重
    float ease = pow(tl, 1.55);

    // 低频噪声调制升力：不同区域升腾速度不同
    float riseMod = 0.55 + 0.9 * vnoise(basePx / uNoiseScalePx * 0.55 + 3.7);

    // 流场采样点跟随主位移走（路径弯曲），场自身随时间演化
    vec2 samplePos = (basePx + uDriftDir * ease * uDriftPx * 0.4) / uNoiseScalePx;
    vec2 flow = curlField(samplePos + vec2(0.0, uTime * uFlowEvolve));

    float speedJitter = 0.7 + 0.6 * h3;
    vec2 velocity = uDriftDir * riseMod + flow * uSwirl;
    vec2 drift = velocity * ease * uDriftPx * speedJitter;

    vec2 jitter = vec2(
        sin(uTime * 6.0 + h1 * 41.0),
        cos(uTime * 5.1 + h2 * 37.0)
    ) * uTurbPx * tl;

    vec2 posPx = basePx + drift + jitter;

    // 烟缕浓淡：低频噪声调制透明度，静止阶段不参与（保证拼回原图）
    float density = 0.55 + 0.45 * vnoise(basePx / uNoiseScalePx * 0.8 + 17.3);
    float fade = pow(1.0 - smoothstep(0.10, 1.0, tl), 1.4);
    float alphaMul = mix(1.0, density, smoothstep(0.05, 0.35, tl));
    vColor = vec4(color.rgb, color.a * fade * alphaMul);
    vActivation = smoothstep(0.0, 0.12, tl);

    gl_PointSize = clamp(mix(uCellPx * 1.2, uCellPx * 0.4, tl), 1.0, uMaxPointPx);
    vec2 ndc = posPx / uViewportPx * 2.0 - 1.0;
    gl_Position = vec4(ndc.x, -ndc.y, 0.0, 1.0);
}`;

const FRAG = `#version 300 es
precision highp float;

in highp vec4 vColor;
in highp float vActivation;
out vec4 outColor;

void main() {
    float r = length(gl_PointCoord - 0.5);
    float circle = 1.0 - smoothstep(0.30, 0.5, r);
    float shape = mix(1.0, circle, vActivation);
    float a = vColor.a * shape;
    outColor = vec4(vColor.rgb * a, a);
}`;

// ============ 蓝本参数（与 Renderer companion 对应） ============
const DENSITY = 2.75;                 // 模拟手机 density
const CELL_PX = 1.5 * DENSITY;        // CELL_DP
const DRIFT_PX = 130 * DENSITY;       // DRIFT_DP
const NOISE_SCALE_PX = 96 * DENSITY;  // NOISE_SCALE_DP
const SWIRL = 0.55;
const FLOW_EVOLVE = 0.5;
const TURB_PX = CELL_PX * 0.8;
const SPREAD_TIME = 0.30, DELAY_JITTER = 0.06, LIFETIME = 0.62;
const TOTAL = SPREAD_TIME + DELAY_JITTER + LIFETIME;
const DRIFT_TILT_DEG = 18;            // 主方向随机倾斜幅度

// ============ 假 Dialog 快照 ============
function makeSnapshot() {
  const w = 320 * DENSITY, h = 190 * DENSITY, r = 16 * DENSITY;
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const g = c.getContext('2d');
  g.beginPath(); g.roundRect(0, 0, w, h, r);
  g.fillStyle = '#f5f6f8'; g.fill();
  g.fillStyle = '#1e2126';
  g.font = `bold ${18 * DENSITY}px sans-serif`;
  g.fillText('删除这条记事？', 24 * DENSITY, 44 * DENSITY);
  g.fillStyle = '#5f6672';
  g.font = `${14 * DENSITY}px sans-serif`;
  g.fillText('删除后会进入回收站，可在 30 天内恢复。', 24 * DENSITY, 82 * DENSITY);
  g.fillText('包含 2 张图片附件。', 24 * DENSITY, 108 * DENSITY);
  g.fillStyle = '#e8544d';
  g.font = `bold ${15 * DENSITY}px sans-serif`;
  g.fillText('删除', 258 * DENSITY, 162 * DENSITY);
  g.fillStyle = '#2f7fe0';
  g.fillText('取消', 196 * DENSITY, 162 * DENSITY);
  return c;
}

// ============ WebGL2 驱动 ============
const canvas = document.getElementById('gl');
const gl = canvas.getContext('webgl2', { premultipliedAlpha: true });

function compile(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS))
    throw new Error(gl.getShaderInfoLog(s));
  return s;
}
const prog = gl.createProgram();
gl.attachShader(prog, compile(gl.VERTEX_SHADER, VERT));
gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FRAG));
gl.linkProgram(prog);
if (!gl.getProgramParameter(prog, gl.LINK_STATUS))
  throw new Error(gl.getProgramInfoLog(prog));
gl.useProgram(prog);

const snap = makeSnapshot();
const tex = gl.createTexture();
gl.activeTexture(gl.TEXTURE0);
gl.bindTexture(gl.TEXTURE_2D, tex);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, false);
gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, snap);

const cols = Math.ceil(snap.width / CELL_PX);
const rows = Math.ceil(snap.height / CELL_PX);
let originX = 0, originY = 0;

const U = n => gl.getUniformLocation(prog, n);
gl.uniform1i(U('uSnapshot'), 0);
gl.uniform1f(U('uCellPx'), CELL_PX);

// pane 布局就绪时机不定：每帧检测客户端尺寸变化，重算 canvas/viewport/居中位置
function fit() {
  const w = Math.max(1, Math.round(canvas.clientWidth * devicePixelRatio));
  const h = Math.max(1, Math.round(canvas.clientHeight * devicePixelRatio));
  if (canvas.width === w && canvas.height === h) return;
  canvas.width = w; canvas.height = h;
  originX = (w - snap.width) / 2;
  originY = (h - snap.height) / 2;
  gl.viewport(0, 0, w, h);
  gl.uniform2f(U('uViewportPx'), w, h);
  gl.uniform2f(U('uOriginPx'), originX, originY);
}
gl.uniform2i(U('uGrid'), cols, rows);
gl.uniform2f(U('uWaveOriginUv'), 0.5, 0.78);
gl.uniform1f(U('uSpreadTime'), SPREAD_TIME);
gl.uniform1f(U('uDelayJitter'), DELAY_JITTER);
gl.uniform1f(U('uLifetime'), LIFETIME);
gl.uniform1f(U('uDriftPx'), DRIFT_PX);
gl.uniform2f(U('uDriftDir'), 0, -1);
gl.uniform1f(U('uNoiseScalePx'), NOISE_SCALE_PX);
gl.uniform1f(U('uSwirl'), SWIRL);
gl.uniform1f(U('uFlowEvolve'), FLOW_EVOLVE);
gl.uniform1f(U('uTurbPx'), TURB_PX);
gl.uniform1f(U('uMaxPointPx'), 256);
const uTime = U('uTime');

gl.disable(gl.DEPTH_TEST);
gl.enable(gl.BLEND);
gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
gl.clearColor(0.1255, 0.1333, 0.1490, 1.0);

let startMs = performance.now(), frozen = null, playing = true;

function setDriftTilt(angleDeg) {
  const rad = (-90 + angleDeg) * Math.PI / 180;
  gl.uniform2f(U('uDriftDir'), Math.cos(rad), Math.sin(rad));
}

function draw() {
  fit();
  const t = frozen !== null ? frozen
      : Math.min((performance.now() - startMs) / 1000, TOTAL);
  gl.uniform1f(uTime, t);
  gl.clear(gl.COLOR_BUFFER_BIT);
  gl.drawArrays(gl.POINTS, 0, cols * rows);
  requestAnimationFrame(draw);
}

window.setT = x => { frozen = x * TOTAL; };       // 冻结在总时长的 x 比例处
window.setTime = x => { frozen = x; };            // 冻结在绝对秒
window.play = angleDeg => {
  frozen = null;
  setDriftTilt(angleDeg !== undefined ? angleDeg
      : (Math.random() * 2 - 1) * DRIFT_TILT_DEG);
  startMs = performance.now();
};
canvas.addEventListener('click', e => {
  const x = (e.clientX * devicePixelRatio - originX) / snap.width;
  const y = (e.clientY * devicePixelRatio - originY) / snap.height;
  gl.uniform2f(U('uWaveOriginUv'),
      Math.min(Math.max(x, 0), 1), Math.min(Math.max(y, 0), 1));
  window.play();
});
draw();
</script>
</body>
</html>
