apply plugin: 'com.android.application'

import groovy.json.JsonOutput
import groovy.json.JsonSlurper
import java.security.MessageDigest
import java.time.Instant
import java.time.ZoneOffset
import java.time.format.DateTimeFormatter

def loadLocalProperties() {
    def props = new Properties()
    def file = rootProject.file('local.properties')
    if (file.exists()) {
        file.withInputStream { props.load(it) }
    }
    return props
}

def localProps = loadLocalProperties()
def updateBaseUrl = localProps.getProperty('everythingdone.update.baseUrl', '').trim()
def updateMetadataUrl = localProps.getProperty('everythingdone.update.metadataUrl', '').trim()
if (!updateMetadataUrl && updateBaseUrl) {
    updateMetadataUrl = updateBaseUrl.replaceAll('/+$', '') + '/debug/latest.json'
}

def quoteBuildConfigString(String value) {
    return '"' + value
            .replace('\\', '\\\\')
            .replace('"', '\\"')
            .replace('\n', '\\n')
            .replace('\r', '\\r') + '"'
}

def debugUpdateStateDir = layout.buildDirectory.dir('generated/debugUpdate/state')
def debugUpdateResDir = layout.buildDirectory.dir('generated/debugUpdate/res')
def debugUpdateResPath = "$buildDir/generated/debugUpdate/res"
def debugUpdateOutputDir = layout.buildDirectory.dir('outputs/update-debug-apk')
def debugUpdateNotesFileProperty = providers.gradleProperty('debugUpdateNotesFile')
def debugUpdateNotesProperty = providers.gradleProperty('debugUpdateNotes')
def rootProjectDir = rootProject.projectDir

def isPublishDebugUpdateRequested = gradle.startParameter.taskNames.any {
    it == 'publishDebugUpdate' || it == ':publishDebugUpdate' || it == ':app:publishDebugUpdate' ||
            it.endsWith(':publishDebugUpdate')
}

android {
    namespace 'com.ywwynm.everythingdone'
    compileSdk 36

    defaultConfig {
        applicationId "com.ywwynm.everythingdone"
        minSdk 26
        targetSdk 36
        versionCode 43
        versionName "2.0.0"
    }

    buildTypes {
        debug {
            buildConfigField 'String', 'DEBUG_UPDATE_METADATA_URL',
                    quoteBuildConfigString(updateMetadataUrl)
        }
        release {
            minifyEnabled true
            shrinkResources true
            buildConfigField 'String', 'DEBUG_UPDATE_METADATA_URL', quoteBuildConfigString('')
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    sourceSets {
        main {
            // FableSol 的 GLSL 由 Android 与桌面 moderngl 蓝本共享，避免双端各维护一份。
            assets.srcDir("$rootDir/shared")
        }
        debug {
            res.srcDir(debugUpdateResPath)
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig = true
    }

    androidResources {
        generateLocaleConfig true
    }

    testOptions {
        unitTests.all {
            // FableSol CPU 帧成本探针默认跳过；只有显式传 -Dfablesol.perf=1 时才透传给测试 JVM。
            def perfFlag = System.getProperty('fablesol.perf')
            if (perfFlag != null) {
                systemProperty 'fablesol.perf', perfFlag
                testLogging { showStandardStreams = true }
            }
            // 音画耦合离线回放探针（Android/Python parity 比对）：只有显式传三个
            // fablesol.probe.* 属性时才产出 CSV，常规单测不受影响。
            ['fablesol.probe.wav', 'fablesol.probe.out',
             'fablesol.probe.profile'].each { key ->
                def value = System.getProperty(key)
                if (value != null) {
                    systemProperty key, value
                    testLogging { showStandardStreams = true }
                }
            }
        }
    }
}

def appUpdateVersionCode = android.defaultConfig.versionCode
def appUpdateVersionName = android.defaultConfig.versionName

tasks.register('prepareDebugUpdatePublish') {
    outputs.file(debugUpdateStateDir.map { it.file('publish.properties') })
    outputs.upToDateWhen { false }
    notCompatibleWithConfigurationCache('Debug update publishing uses a fresh timestamp.')
    doLast {
        def now = Instant.now()
        def props = new Properties()
        props.setProperty(
                'debugUpdateCode',
                DateTimeFormatter.ofPattern('yyyyMMddHHmm').withZone(ZoneOffset.UTC).format(now)
        )
        props.setProperty('publishedAt', DateTimeFormatter.ISO_INSTANT.format(now))
        def outFile = debugUpdateStateDir.get().file('publish.properties').asFile
        outFile.parentFile.mkdirs()
        outFile.withOutputStream { props.store(it, 'Generated by prepareDebugUpdatePublish') }
    }
}

tasks.register('generateDebugUpdateValues') {
    if (isPublishDebugUpdateRequested) {
        dependsOn tasks.named('prepareDebugUpdatePublish')
    }
    outputs.dir(debugUpdateResDir)
    outputs.upToDateWhen { false }
    doLast {
        def code = '0'
        def propsFile = debugUpdateStateDir.get().file('publish.properties').asFile
        if (isPublishDebugUpdateRequested && propsFile.exists()) {
            def props = new Properties()
            propsFile.withInputStream { props.load(it) }
            code = props.getProperty('debugUpdateCode', '0')
        }
        def valuesDir = debugUpdateResDir.get().dir('values').asFile
        valuesDir.mkdirs()
        new File(valuesDir, 'debug_update.xml').text =
                """<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<resources>\n    <string name=\"debug_update_code\" translatable=\"false\">${code}</string>\n</resources>\n"""
    }
}

tasks.matching { it.name == 'preDebugBuild' }.configureEach {
    dependsOn tasks.named('generateDebugUpdateValues')
}

def requiredUpdateProperty(Properties props, String name) {
    def value = props.getProperty(name, '').trim()
    if (!value) {
        throw new GradleException("Missing local.properties value: ${name}")
    }
    return value
}

def sha256Hex(File file) {
    def digest = MessageDigest.getInstance('SHA-256')
    file.withInputStream { input ->
        byte[] buffer = new byte[1024 * 1024]
        int read
        while ((read = input.read(buffer)) != -1) {
            digest.update(buffer, 0, read)
        }
    }
    return digest.digest().collect { String.format('%02x', it) }.join()
}

def runCommand(List<String> commandLine) {
    def processBuilder = new ProcessBuilder(commandLine.collect { it.toString() })
    processBuilder.redirectErrorStream(true)
    processBuilder.redirectInput(ProcessBuilder.Redirect.INHERIT)
    def process = processBuilder.start()
    process.inputStream.withReader('UTF-8') { reader ->
        String line
        while ((line = reader.readLine()) != null) {
            println line
        }
    }
    def exitCode = process.waitFor()
    if (exitCode != 0) {
        throw new GradleException("Command failed with exit code ${exitCode}: ${commandLine[0]}")
    }
}

def shellQuote(String value) {
    return "'" + value.replace("'", "'\"'\"'") + "'"
}

def currentDebugUpdateNotes(String notes) {
    def normalized = notes.replace('\r\n', '\n').replace('\r', '\n').trim()
    if (!normalized) {
        return ''
    }

    def lines = normalized.split('\n', -1) as List
    def firstEntryIndex = -1
    for (int i = 0; i < lines.size(); i++) {
        if (lines[i].startsWith('## ')) {
            firstEntryIndex = i
            break
        }
    }
    if (firstEntryIndex < 0) {
        return normalized
    }

    def nextEntryIndex = lines.size()
    for (int i = firstEntryIndex + 1; i < lines.size(); i++) {
        if (lines[i].startsWith('## ')) {
            nextEntryIndex = i
            break
        }
    }
    return lines.subList(firstEntryIndex, nextEntryIndex).join('\n').trim()
}

tasks.register('publishDebugUpdate') {
    group = 'publishing'
    description = 'Assembles, uploads, and publishes the latest debug APK update metadata.'
    dependsOn tasks.named('prepareDebugUpdatePublish')
    dependsOn tasks.named('assembleDebug')
    outputs.upToDateWhen { false }
    notCompatibleWithConfigurationCache('Debug update publishing shells out to ssh/scp and uses fresh timestamps.')

    doLast {
        def propsFile = debugUpdateStateDir.get().file('publish.properties').asFile
        if (!propsFile.exists()) {
            throw new GradleException('Debug update publish state was not generated.')
        }
        def publishProps = new Properties()
        propsFile.withInputStream { publishProps.load(it) }
        def debugUpdateCode = publishProps.getProperty('debugUpdateCode', '').trim()
        def publishedAt = publishProps.getProperty('publishedAt', '').trim()
        if (!debugUpdateCode || !publishedAt) {
            throw new GradleException('Debug update publish state is incomplete.')
        }

        def host = requiredUpdateProperty(localProps, 'everythingdone.update.host')
        def user = requiredUpdateProperty(localProps, 'everythingdone.update.user')
        def remoteDir = requiredUpdateProperty(localProps, 'everythingdone.update.remoteDir').replaceAll('/+$', '')
        def baseUrl = requiredUpdateProperty(localProps, 'everythingdone.update.baseUrl').replaceAll('/+$', '')
        def sshKey = localProps.getProperty('everythingdone.update.sshKey', '').trim()
        def port = localProps.getProperty('everythingdone.update.port', '').trim()

        def apk = layout.buildDirectory.file('outputs/apk/debug/app-debug.apk').get().asFile
        if (!apk.exists()) {
            throw new GradleException("Debug APK not found: ${apk.absolutePath}")
        }

        def apkName = "app-debug-${debugUpdateCode}.apk"
        def outputDir = debugUpdateOutputDir.get().asFile
        outputDir.mkdirs()
        def stagedApk = new File(outputDir, apkName)
        stagedApk.bytes = apk.bytes

        def notes = ''
        def notesFilePath = debugUpdateNotesFileProperty.orNull
        def notesValue = debugUpdateNotesProperty.orNull
        if (notesFilePath) {
            def notesFile = new File(rootProjectDir, notesFilePath)
            if (!notesFile.exists()) {
                throw new GradleException("debugUpdateNotesFile does not exist: ${notesFile.absolutePath}")
            }
            notes = currentDebugUpdateNotes(notesFile.getText('UTF-8'))
        } else if (notesValue) {
            notes = currentDebugUpdateNotes(notesValue)
        }

        def metadata = [
                channel        : 'debug',
                debugUpdateCode: debugUpdateCode.toLong(),
                versionCode    : appUpdateVersionCode,
                versionName    : appUpdateVersionName,
                apkUrl         : "${baseUrl}/debug/apk/${apkName}",
                sha256         : sha256Hex(stagedApk),
                sizeBytes      : stagedApk.length(),
                publishedAt    : publishedAt
        ]
        if (notes.trim()) {
            metadata.releaseNotes = notes
        }
        def metadataFile = new File(outputDir, 'latest.json')
        def metadataJson = JsonOutput.prettyPrint(JsonOutput.toJson(metadata)) + '\n'
        def parsedMetadata = new JsonSlurper().parseText(metadataJson)
        if (!(parsedMetadata instanceof Map)) {
            throw new GradleException('Generated debug update metadata must be a JSON object.')
        }
        metadataFile.setText(metadataJson, 'UTF-8')

        def sshBase = ['ssh']
        def scpBase = ['scp']
        if (sshKey) {
            sshBase += ['-i', sshKey]
            scpBase += ['-i', sshKey]
        }
        if (port) {
            sshBase += ['-p', port]
            scpBase += ['-P', port]
        }

        def remote = "${user}@${host}"
        runCommand(sshBase + [remote, "set -e; mkdir -p ${shellQuote(remoteDir + '/debug/apk')}"])
        runCommand(scpBase + [stagedApk.absolutePath, "${remote}:${remoteDir}/debug/apk/${apkName}"])
        runCommand(scpBase + [metadataFile.absolutePath, "${remote}:${remoteDir}/debug/latest.json.tmp"])
        runCommand(sshBase + [remote,
                "set -e; mv ${shellQuote(remoteDir + '/debug/latest.json.tmp')} ${shellQuote(remoteDir + '/debug/latest.json')}; " +
                        "cd ${shellQuote(remoteDir + '/debug/apk')}; " +
                        "ls -1t app-debug-*.apk 2>/dev/null | tail -n +6 | xargs -r rm -f"
        ])

        logger.lifecycle("Published debug update ${debugUpdateCode} to ${baseUrl}/debug/latest.json")
    }
}

