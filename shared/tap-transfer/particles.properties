# 碰一碰的动画参数：发送（记事抬起成卡片、化成颗粒流进 NFC 天线、流回）与接收（屏幕边框粒子、
# 颗粒从天线与屏幕四边流进列表空位）。
# Android（TapParticleParams）与桌面模拟器（docs/features/thing-transfer/particle-sim）读同一份文件；
# 在模拟器里调好的值写回这里，重新编译即在手机上生效。
# 列表值用英文逗号分隔；颜色写成 6 位十六进制 RGB。

# ---- 终点（ParticleSink）：只作用于带终点的会话，弹窗、首页卡片等其余粒子动画不读这里 ----
# 释放时刻整体乘这个比例，给最晚释放的那批留出飞行时间
sink_release_scale=0.75
# 最后一片最晚在时间轴（1 秒）的这一刻抵达终点
sink_arrival_end=0.96
# 飞行时长（秒）=（基础 + 每个短边距离加的时长）×（1 ± 抖动）
sink_flight_base=0.30
sink_flight_per_span=0.11
sink_flight_jitter=0.18
# 最短寿命（秒）
sink_min_life=0.14
# 绕终点的切向分量（相对径向速度的比例）：柔性终点里是整团滑行的缓弧（恒定），
# 旧的终点牵引里随飞行进度衰减到 0
sink_swirl=0.30
# 转向终点的过渡区间（飞行进度 0–1）：smoothstep(起, 止, 进度)
sink_homing=0.08,0.50
# 流向边框的颗粒沿边错开的全幅，占边框短边的比例
sink_frame_jitter=0.36
# 柔性终点（2026-09-25 起）：不再让每一片都收进同一点。流向天线的颗粒只有这一份被吸入，
# 其余按弹窗的方式在途中消散（寿命乘 sink_free_life），并以每秒若干短边的速度朝天线漂移
sink_absorb_share=0.8
sink_free_life=1.3
sink_drift=0.9
# 被吸入的颗粒落在天线周围这个半径（dp）的圆盘里。切向速度 / 径向速度：远处是 sink_swirl，
# 进入涡旋核（半径 dp）之后按 r²/(d²+r²) 换成下面这个值；0 表示贴近落点只剩径向分量，末段不旋转
sink_spread_dp=40
sink_spiral=0
sink_vortex_dp=48
# 进入天线周围时逐渐隐去：从外半径到内半径（dp）；寿命末端的淡出时长（秒，弹窗是 0.075）
sink_absorb_dp=8,40
# 贴近天线时颗粒缩到原来的这个比例（纵深上的远去）
sink_near_scale=0.5
# 整团滑行：被牵引的颗粒在这个时间窗（粒子时间轴 0–1）里抵达，与释放先后无关；
# 牵引在 [起, 止] 这段绝对时间里渐入，接近增益 > 1 时先快后慢地落定
sink_arrival=0.86,0.98
sink_glide=0.3,0.62,1.6
# 几张卡片同时拼出时按卡片错开：第一张出生平移（粒子时间轴，倒放时最先拼好）与最后一张抵达提前量；
# 切向倍数沿卡片顺序增加的量。一张卡片时不起作用
sink_group_stagger=0.1,0.06
sink_group_swirl=0.8
sink_fade_s=0.15
# 流向边框的颗粒：落在边框向内这个宽度（dp）的带里；途中的螺线切向比与卷流强度
sink_band_dp=40
sink_band_spiral=0.15
sink_curl=0.2

# ---- 发送：打开分享界面 ----
# 页面上的黑色罩层：浅色 / 深色模式下的不透明度；打开与关闭的时长（毫秒）
send_dim_alpha=0.5,0.62
send_open_ms=360
send_close_ms=300
# 记事抬起成卡片：时长（毫秒）与缓动；落回的时长与缓动
send_lift_ms=460
send_lift_ease=0.2,0,0,1
send_drop_ms=320
send_drop_ease=0.4,0,0.6,1
# 抬起进度的前这一段里卡片淡入（盖住列表里的原件）
send_lift_fade=0.35
# 详情页里卡片从目标位置下方多远升起（dp）、从多小放大到原尺寸
send_detail_rise_dp=56
send_detail_rise_scale=0.94
# 抬起后的投影高度（dp）；碰上后截图之前压下投影的时长（毫秒）；恢复投影的时长只用于旧版的流回
# （第三版第三轮起发送完成后重新抬起，投影随抬起恢复）
send_elevation_dp=10
send_shadow_drop_ms=140
send_shadow_restore_ms=220
# 等待被碰时天线处的扩散圈：圈数、一圈的周期（秒）、半径 = 前一项 + 后一项 × 进度（dp）、最大不透明度
send_pulse_rings=2
send_pulse_period_s=1.8
send_pulse_radius_dp=10,34
send_pulse_alpha=0.6
# 波纹从等待被碰一直播到关闭；流出时随进度收缩到原来的 (1 − 这个值)，流回时展开。接收同一套波纹
send_pulse_shrink=0.5

# ---- 发送：流出与流回 ----
# 卡片流进天线的整段时长（进度 0 → 1，毫秒）与缓动（三次贝塞尔控制点 x1,y1,x2,y2，同 PathInterpolator）。
# 进度与粒子时间轴一一对应，时长约为时间轴的 1.5 倍，颗粒的速度与首页、弹窗的消散相近。
# 缓动起步缓入、结束缓出；中段不能太陡：释放集中在进度的前 0.6，中段一快，剥离就变成整张卡片
# 同时散开。这条曲线中段最快只有平均速度的 1.5 倍，剥离铺开约 0.8 秒。
send_outflow_ms=1500
send_outflow_ease=0.30,0,0.60,1
# 流完之后「已发送」停留多久再重新抬起卡片（毫秒）。重新抬起与打开分享时的抬起相同
# （send_lift_ms、send_lift_ease），不再从天线处流回
send_sent_hold_ms=900
# 旧版：从天线流回、拼回卡片的整段时长（进度 1 → 0，毫秒）与缓动
send_reform_ms=1200
send_reform_ease=0.30,0,0.20,1
# 天线处的光，亮度随流出进度：smoothstep(a, b, 进度) ×（1 − smoothstep(c, d, 进度)）
send_glow_curve=0.18,0.55,0.88,1
# 光点半径 = 前一项 + 后一项 × 亮度（dp）；不透明度 = 系数 × 亮度
send_glow_radius_dp=14,10
send_glow_alpha=0.7

# ---- 接收：接收状态的罩层与屏幕边框 ----
# 页面底色的罩层：浅色 / 深色模式下的不透明度与淡入淡出的时长（秒）。颗粒很细，列表里同色的
# 卡片没压下去就会把它们吞掉（2026-09-24 三星上实测 0.55 不够）
receive_dim_alpha=0.78,0.72
receive_dim_fade_s=0.35
# 边框出现、退场的淡入淡出（秒）；颗粒开始从四边流出时边框淡去的时长（秒）
receive_border_fade_s=0.6
receive_border_converge_s=0.35
# 边框粒子：离屏幕边缘多远（dp）、沿周长的间距（dp）、流带宽度（dp）、平均速度（dp/秒，顺时针）
receive_border_inset_dp=3
receive_border_spacing_dp=1.7
receive_border_lane_dp=14
receive_border_speed_dp=80
# 横向起伏的幅度（dp）、拖尾按多少秒的运动长度画、粒子实心半径的范围（dp）、新粒子淡入（秒）
receive_border_wobble_dp=3.5
receive_border_trail_s=0.2
receive_border_radius_dp=1.0,2.6
receive_border_particle_fade_s=0.8
# 调色板（沿屏幕一圈均匀分布，相邻颜色之间线性插值）与它转一圈的秒数；碰上后换成来件颜色的时长（秒）
receive_border_palette=F66048,FFAE36,21A675,00B1C6,166096,665696
receive_border_palette_cycle_s=22
receive_border_palette_fade_s=0.5
# 边框底下那圈光：圈数、每圈宽度（dp）、最外圈的不透明度（由外向内按平方衰减）
receive_glow_rings=20
receive_glow_ring_dp=1.2
receive_glow_alpha=0.3
# 刚收到的卡片在罩层上的空洞，下一台碰上时合上的时长（秒）
receive_hole_close_s=0.45

# ---- 接收：屏幕四周的光尘带（2026-09-25 起，取代上面的拖尾粒子）----
# 与弹窗消散同一种微片：细小的圆角方片、翻转时闪光、没有拖尾。每 dp 周长的颗粒数、带宽（dp）、
# 颗粒尺寸范围（dp）、沿边流动的平均速度（dp/秒，顺时针）、噪声漂移幅度（dp）、翻转频率范围（Hz）
receive_dust_per_dp=8
receive_dust_band_dp=16
receive_dust_size_dp=0.7,1.3
receive_dust_speed_dp=26
receive_dust_wander_dp=5
receive_dust_flip_hz=0.4,1.3
# 传输进度：静止时出场的颗粒比例（进度越高越多，100% 时全部）；光尘带贴着边缘向内扩散，
# 100% 时比等待时多扩散的深度（dp），列表让位期间继续缓慢扩散；颗粒向内扩散一轮的频率范围（Hz）
receive_dust_rest=0.55
receive_dust_spread_dp=22
receive_dust_inward_hz=0.18,0.45
# 带底下的柔光：高斯晕的宽度 = 半个带宽 + 这个值（dp）；峰值不透明度
receive_dust_glow=5,0.16
# 旧版：开始流入时光尘带边淡去边向内移动的距离（dp，先慢后快）
receive_dust_pull_dp=30
# 开始流入时（第三版第三轮起）：扩散出去的一部分光尘被拼卡的颗粒接手，其余从边缘向外退去这么远（dp）、
# 同时渐隐，用时（秒）
receive_dust_retreat=24,0.8

# ---- 接收：颗粒流入 ----
# 颗粒流进空位、拼成卡片的时长（秒）
receive_appear_s=1.3
# 流向屏幕边框（而不是天线）的颗粒占比（代理那层与真实那层相同）
receive_frame_share=0.2
# 哪一片来自屏幕四周、哪一片来自天线按远近分配：比「到天线的距离 − 到边框落点的距离」，大的那一份来自四周。
# 这个差值上加一个标准差为这么多 dp 的扰动，两部分之间是一段混在一起的过渡、没有分界线
receive_frame_blend_dp=48
# 由光尘接手的颗粒拼卡时不按弹窗的风向先飞出去：剥离之后牵引按年龄在这段粒子时间里渐入，直接滑向卡片；
# 途中卷流的倍数与取样频率（1.37 是其余颗粒的尺度，越大卷得越碎）
receive_handoff=0.08,2.5,3.5

# ---- 接收：进度期间天线处的颗粒（2026-09-25 第三版第六轮）——弹窗出现动画的前半段 ----
# 记事内容要到传输结束才到，进度期间按预计落点做几张代表色的代理卡片，播它们弹窗出现的倒放；流入开始时与真实
# 卡片的倒放交叉淡化（两层共用一条倒放时间轴）。
# 倒放时间轴：传输期间 = 第一项 × 进度^第四项 + 第二项（每秒）× 碰上以来的秒数（第四项 < 1：起步快）；数据到齐
# 之后按指数逼近第三项（越来越慢但不停，不会先拼出代理卡片）；流入开始之后平滑加速，流入时长结束时拼好
receive_emerge_pace=0.22,0.02,0.34,0.5
# 两层共用：从天线处出来的那一份落点散开的半径（dp）、贴近天线时淡去的外半径（dp）、占比（其余按弹窗出现的
# 方式沿途浮现）、冒出时的淡入（时间轴单位；进度期间时间轴走得慢，按发送的 0.15 会拉成一秒多）
receive_emerge_sink=40,1,0.8,0.04
# 交叉淡化：真实那层淡入的时长（秒）、代理那层淡出的起止（流入开始之后的秒数）
receive_crossfade=0.3,0.05,0.35
# 光尘接手流向四边的颗粒：在倒放时间轴上交接之后的 [前一项, 第二项] 里出现；只挑正向飞行时间不短于第三项的颗粒
receive_dust_join=0.02,0.14,0.3
# 预计落点的高度 = 宽度 × 发送方在握手里告知的高宽比 × 这个值（模拟器里高宽比取最终卡片的；1 = 准确，
# 调它可以试预计不准的情形）
receive_emerge_aspect=1
