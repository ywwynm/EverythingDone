gradle.beforeProject { project ->
    if (project.path == ':app') {
        project.plugins.withId('com.android.application') {
            project.extensions.getByName('androidComponents').finalizeDsl { android ->
                android.defaultConfig.applicationId = 'com.ywwynm.everythingdone.batchvalidation'
                android.sourceSets.main.manifest.srcFile(project.rootProject.file('tmp/selection-transition-20261013/main-manifest.xml'))
                android.sourceSets.debug.manifest.srcFile(project.rootProject.file('tmp/selection-transition-20261013/debug-manifest.xml'))
            }
        }
    }
}
