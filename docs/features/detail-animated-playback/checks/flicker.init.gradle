gradle.beforeProject { project ->
    if (project.path == ':app') {
        project.plugins.withId('com.android.application') {
            project.extensions.getByName('androidComponents').finalizeDsl { android ->
                android.defaultConfig.applicationId = 'com.ywwynm.everythingdone.gifflickervalidation'
                android.sourceSets.main.manifest.srcFile(project.rootProject.file('tmp/detail-gif-flicker/main-manifest.xml'))
                android.sourceSets.debug.manifest.srcFile(project.rootProject.file('tmp/detail-gif-flicker/debug-manifest.xml'))
                android.sourceSets.debug.assets.srcDir(project.rootProject.file('tmp/detail-gif-flicker/assets'))
            }
        }
    }
}
